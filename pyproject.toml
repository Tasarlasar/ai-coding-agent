[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-cli"
version = "0.1.0"
description = "A personal AI coding agent CLI (bring your own API key, any model)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tasarlasar"}]
keywords = ["ai", "agent", "coding-agent", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = ["litellm>=1.109.1,<2"]
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
agent = "agent.cli:main"
[tool.setuptools]
packages = ["agent", "agent.providers"]
[tool.pytest.ini_options]
testpaths = ["tests"]
